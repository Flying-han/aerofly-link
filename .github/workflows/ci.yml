name: CI

on:
  push:
  pull_request:

jobs:
  c-client:
    # C 客户端构建 + 单测 + 产物上传（单轨，docs/C_REWRITE_PLAN.md）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.15.1
      - name: Build & test
        shell: cmd
        run: client-c\build.cmd
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: aeroflylink-binaries
          path: |
            client-c/build/aeroflylink.exe
            client-c/build/aeroflylink.exe.manifest
            client-c/build/aeroflylink-cli.exe
          if-no-files-found: error

  installer:
    # 安装器编译验证（ISCC 语法 / VERSION 读取 / 载荷路径）
    # AeroflyBridge.dll 为 gitignored 载荷，CI 用占位文件仅验证脚本本身
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.15.1
      - name: Build
        shell: cmd
        run: client-c\build.cmd
      - name: Place placeholder bridge DLL
        shell: cmd
        run: |
          cd client-c\setup
          rem 占位仅验证 .iss 编译；真实载荷由 release.yml 从上游下载
          echo placeholder>AeroflyBridge.dll
      - name: Compile installer
        shell: cmd
        run: |
          choco install innosetup -y --no-progress
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" client-c\setup\aerofly_link_setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist_installer/*.exe
          if-no-files-found: error
