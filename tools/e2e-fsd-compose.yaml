services:
  mariadb:
    image: ${E2E_MARIADB_IMAGE:-mariadb:10.11.19}
    environment:
      MARIADB_ROOT_PASSWORD: ${E2E_DB_PASSWORD:?set a synthetic E2E password}
      MARIADB_DATABASE: fsd
      MARIADB_USER: fsd
      MARIADB_PASSWORD: ${E2E_DB_PASSWORD:?set a synthetic E2E password}
      TZ: UTC
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [backend]
    restart: "no"

  redis:
    image: ${E2E_REDIS_IMAGE:-redis:8.10.1}
    command:
      ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${E2E_REDIS_PASSWORD:?set a synthetic E2E password}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${E2E_REDIS_PASSWORD:?set a synthetic E2E password}' ping 2>/dev/null | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [backend]
    restart: "no"

  migrate:
    image: ${E2E_FSD_IMAGE:?build FSD from the local source checkout first}
    entrypoint: ["/fsd"]
    command: ["-config", "/run/config.json", "migrate", "up"]
    user: "65532:65532"
    read_only: true
    init: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    volumes:
      - type: bind
        source: ${E2E_FSD_CONFIG:?generate an isolated FSD config}
        target: /run/config.json
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /app/logs:rw,nosuid,nodev,size=32m,uid=65532,gid=65532,mode=0750
      - /app/uploads:rw,nosuid,nodev,size=32m,uid=65532,gid=65532,mode=0750
    depends_on:
      mariadb:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  fsd:
    image: ${E2E_FSD_IMAGE:?build FSD from the local source checkout first}
    command: ["-config", "/run/config.json"]
    user: "65532:65532"
    read_only: true
    init: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    environment:
      FSD_REDIS_PASSWORD: ${E2E_REDIS_PASSWORD:?set a synthetic E2E password}
      TZ: UTC
    ports:
      - "127.0.0.1:${E2E_FSD_TCP_PORT:-16809}:6809/tcp"
      - "127.0.0.1:${E2E_FSD_HTTP_PORT:-16810}:6810/tcp"
    volumes:
      - type: bind
        source: ${E2E_FSD_CONFIG:?generate an isolated FSD config}
        target: /run/config.json
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /app/logs:rw,nosuid,nodev,size=64m,uid=65532,gid=65532,mode=0750
      - /app/uploads:rw,nosuid,nodev,size=64m,uid=65532,gid=65532,mode=0750
    healthcheck:
      test: ["CMD", "/fsd", "healthcheck"]
      interval: 2s
      timeout: 3s
      start_period: 15s
      retries: 30
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [backend, client]
    restart: "no"

volumes:
  mariadb_data:

networks:
  backend:
    driver: bridge
    internal: true
  client:
    driver: bridge
